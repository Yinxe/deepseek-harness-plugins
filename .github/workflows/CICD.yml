# CI 门禁 + 打包发布：PR 与普通分支推送只跑门禁；
# main 推送、v* tag 推送、手动触发在门禁全过后额外打包所有插件并发 GitHub Release。
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suffix:
        description: '包名后缀（如 latest 或 v0.1.5-rc1）；latest 且构建自 main 时滚动更新 latest 预发布，其他后缀自动创建同名 tag 与预发布'
        required: false
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.meta.outputs.suffix }}
      pack: ${{ steps.meta.outputs.pack }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Determine package suffix
        id: meta
        env:
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            suffix="$GITHUB_REF_NAME"
          else
            suffix="${INPUT_SUFFIX:-latest}"
          fi
          if [[ ! "$suffix" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$suffix" == *..* ]]; then
            echo "::error::suffix 仅允许字母数字与 . _ -（不得以 . - 开头或含 ..，需可作为 git tag），实际收到：$suffix"
            exit 1
          fi

          # 打包与发布范围：v* tag / main / 手动触发，以及 dev、feature/* 之外的分支推送；
          # PR、dev、feature/* 推送只做门禁
          pack=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            pack=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == "refs/heads/main" ]]; then
              pack=true
            elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
              branch="${GITHUB_REF#refs/heads/}"
              if [[ "$branch" != "dev" && "$branch" != feature/* ]]; then
                pack=true
                branch_tag=$(printf '%s' "$branch" | tr '/' '-')
                if [[ "$branch_tag" == "latest" || ! "$branch_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$branch_tag" == *..* ]]; then
                  branch_tag="branch-${GITHUB_SHA::7}"
                fi
                suffix="$branch_tag"
              fi
            fi
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      - name: Pack all plugins
        if: steps.meta.outputs.pack == 'true'
        env:
          SUFFIX: ${{ steps.meta.outputs.suffix }}
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            pkg_name=$(node -p "require('./${dir}package.json').name")
            pkg_ver=$(node -p "require('./${dir}package.json').version")
            short=${pkg_name##*/}
            (cd "$dir" && pnpm pack --pack-destination ../../dist)
            mv "dist/dshp-$short-$pkg_ver.tgz" "dist/dshp-$short-$SUFFIX.tgz"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.pack == 'true'
        with:
          name: dshp-plugins-${{ steps.meta.outputs.suffix }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: check
    if: needs.check.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh 用显式仓库解析，不依赖 git remote；checkout 只为 gen-release-notes.cjs 读取 plugins/*/package.json
      GH_REPO: ${{ github.repository }}
    steps:
      # checkout 必须在 download-artifact 之前：其默认 clean: true 会执行
      # git clean -ffdx，若放在后面会把先下载的 dist/ 清空
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dshp-plugins-${{ needs.check.outputs.suffix }}
          path: dist

      - name: Create versioned GitHub release
        if: github.ref_type == 'tag'
        run: |
          # tag 可能由 web 端发布 release 时先行创建，此时追加资产；否则新建并生成 notes
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
          fi

      - name: Create suffix/branch prerelease
        if: (github.event_name == 'workflow_dispatch' && inputs.suffix != 'latest') || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main')
        env:
          SUFFIX: ${{ needs.check.outputs.suffix }}
        run: |
          # 已存在的同名预发布（含自动 tag）整体重建；同名正式 release 拒绝覆盖
          if gh release view "$SUFFIX" >/dev/null 2>&1; then
            if ! gh release view "$SUFFIX" --json isPrerelease -q '.isPrerelease' | grep -q true; then
              echo "::error::已存在同名正式 release，拒绝覆盖（suffix=$SUFFIX）"
              exit 1
            fi
            gh release delete "$SUFFIX" --yes --cleanup-tag
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            header="手动触发的测试构建（${GITHUB_SHA::7}）。同名 tag 为 workflow 自动创建。"
          else
            header="分支 $GITHUB_REF_NAME 的测试构建（${GITHUB_SHA::7}），每次推送自动整体重建。"
          fi
          NOTES_HEADER="$header" \
          NOTES_HINT="正式发版前请先删除：\`gh release delete $SUFFIX --cleanup-tag --yes\`" \
            node scripts/gen-release-notes.cjs
          gh release create "$SUFFIX" dist/*.tgz \
            --target "$GITHUB_SHA" \
            --title "$SUFFIX" \
            --notes-file notes.md \
            --prerelease

      - name: Refresh rolling "latest" prerelease
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.suffix == 'latest')
        run: |
          gh release delete latest --yes --cleanup-tag || true
          NOTES_HEADER="滚动构建自 main 分支（${GITHUB_SHA::7}），每次推送自动整体替换。" \
            node scripts/gen-release-notes.cjs
          gh release create latest dist/*.tgz \
            --target "$GITHUB_SHA" \
            --title "latest (main@${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --prerelease
