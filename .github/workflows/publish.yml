name: publish

on:
  push:
    tags:
      - "vision-bridge-v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需（OIDC），不要再配 NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - name: 校验 tag 与包版本一致
        run: |
          TAG="${GITHUB_REF_NAME#vision-bridge-v}"
          PKG="$(node -p "require('./plugins/vision-bridge/package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag($TAG) != package($PKG)，拒绝发布"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm build

      # monorepo：逐包发布（root private 会自动跳过，只发 plugins/*）
      # 注意：不要设置 NODE_AUTH_TOKEN
      - run: pnpm -r publish --provenance --access public --no-git-checks
