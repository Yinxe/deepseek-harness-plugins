name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需（OIDC），不要再配 NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # 免 Token 发布（Trusted Publisher），自带 provenance
      # 注意：不要设置 NODE_AUTH_TOKEN
      - run: pnpm publish --provenance --access public --no-git-checks
